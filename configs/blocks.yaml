# Registry of orthomosaic blocks to process. Add one entry per block as data arrives.
# Paths may be absolute, or relative to the project root (data/ is git-ignored, so it is a
# convenient place to put imagery). Use forward slashes, even on Windows.
# dsm/dtm are optional (null if not available) — used only for CHM-based QC, not required for detection.
#
# The original production run registered 26 blocks (pilot + block_002 ... block_026, ~300 ha
# each); their per-block results are in RESULTS.md. The imagery itself is proprietary and not
# included in this repository.

blocks:
  - block_id: pilot
    description: "Pilot subset (~85 ha) used to build and validate the workflow"
    rgb: "data/pilot/rgb.tif"
    dsm: "data/pilot/dsm.tif"
    dtm: "data/pilot/dtm.tif"

  - block_id: block_002
    description: "Example production block without elevation data"
    rgb: "data/block_002/rgb.tif"
    dsm: null
    dtm: null
