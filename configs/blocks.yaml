# Registry of 300-ha production blocks. Add one entry per block as data arrives.
# dsm/dtm are optional (null until provided) — used only for CHM-based QC, not required for detection.

blocks:
  - block_id: pilot
    description: "Pilot dev subset (~85 ha) used to build and validate the workflow"
    # Samplesize_clean.tif is a re-encoded copy of the original with a rebuilt overview
    # pyramid — the original's embedded overviews were stale/corrupted (looked black when
    # zoomed out in QGIS despite the real full-res data being fine). Identical CRS, extent,
    # resolution, and pixel values to the original — just fixes rendering. Use this one when
    # opening directly in QGIS; the original Samplesize.tif is left untouched as-is.
    rgb: "E:/SHOLA ARPN/compressed/data/Samplesize_clean.tif"
    dsm: "E:/SHOLA ARPN/compressed/dsm data/dsm.tif"
    dtm: "E:/SHOLA ARPN/compressed/dtm data/dtm.tif"

  - block_id: block_002
    description: "second production block"
    rgb: "E:/SHOLA ARPN/compressed/block_002/rgb.tif"
    dsm: "E:/SHOLA ARPN/compressed/block_002/dsm.tif"
    dtm: "E:/SHOLA ARPN/compressed/block_002/dtm.tif"

